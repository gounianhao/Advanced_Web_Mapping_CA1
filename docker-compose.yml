# Meet Halfway - container stack
#
#   nginx    Nginx reverse proxy: static files + security headers   -> http://localhost
#   web      Django served by gunicorn (not published to the host)
#   db       PostgreSQL 16 + PostGIS 3.4 (not published to the host)
#   pgadmin  pgAdmin 4 for the database (this computer only)         -> http://localhost:5050
#
# All settings come from .env (copy .env.example to .env first). Every
# container has a fixed address on the private network meet-halfway-net.

name: meet-halfway

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume: the data survives container restarts and rebuilds.
      - postgis_data:/var/lib/postgresql/data
    # No "ports:" on purpose - only containers on the private network can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      meetnet:
        ipv4_address: ${DOCKER_SUBNET_PREFIX:-172.28.0}.10

  web:
    build: .
    image: meet-halfway-web
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      # Filled by collectstatic when the container starts, served by Nginx.
      - static_files:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      meetnet:
        ipv4_address: ${DOCKER_SUBNET_PREFIX:-172.28.0}.20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      meetnet:
        ipv4_address: ${DOCKER_SUBNET_PREFIX:-172.28.0}.30

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      # 127.0.0.1: only this computer can open pgAdmin, not others on the network.
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Registers the PostGIS server the first time pgAdmin starts.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      meetnet:
        ipv4_address: ${DOCKER_SUBNET_PREFIX:-172.28.0}.40

networks:
  meetnet:
    name: meet-halfway-net
    driver: bridge
    ipam:
      config:
        # Custom subnet; change DOCKER_SUBNET_PREFIX in .env if it clashes.
        - subnet: "${DOCKER_SUBNET_PREFIX:-172.28.0}.0/24"

volumes:
  postgis_data:
  pgadmin_data:
  static_files:
