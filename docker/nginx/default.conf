# Meet Halfway - Nginx reverse proxy
#
# Serves the static files itself and passes every other request to gunicorn
# in the web container. Django adds X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy and Cross-Origin-Opener-Policy; Nginx adds the
# Content-Security-Policy, which lists the only places the browser may load
# scripts, styles, fonts and map tiles from.

upstream meet_halfway_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;          # don't advertise the Nginx version
    client_max_body_size 1m;    # the API only receives small JSON bodies

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
        access_log off;
    }

    # Django's admin map widget starts OpenLayers with an inline script, so
    # admin pages (staff only) also allow inline scripts.
    location /admin/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

        proxy_pass http://meet_halfway_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://meet_halfway_web;
        proxy_set_header Host $http_host;     # keeps the port, needed for Django's CSRF check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
